[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis5800-3d-vision"
version = "0.1.0"
description = "Course implementations of calibrated stereo reconstruction and neural rendering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10", "scipy>=1.11", "opencv-python-headless>=4.8", "imageio>=2.31", "tqdm>=4.66", "matplotlib>=3.8"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
vision5800 = "vision5800.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
